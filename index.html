      <input type="range" min="0" max="1" step="0.01" value="0.25" class="volume-slider" id="volumeSlider" aria-label="Volume" />
    </div>
    <button class="audio-toggle" id="audioToggle" aria-label="Mute video">

        <polygon id="volumeWedge" points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" fill="currentColor" stroke="none"/>
        <path id="volumeMuteX" d="M23 9l-6 6M17 9l6 6" style="display:none" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/>
        <path id="volumeWave1" d="M15.54 8.46a5 5 0 0 1 0 7.07" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        <path id="volumeWave2" d="M19.07 4.93a10 10 0 0 1 0 14.14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <script>
    const overlay = document.getElementById('enterOverlay');
    const video = document.getElementById('bgVideo');
    const audioToggle = document.getElementById('audioToggle');
    const volumeSlider = document.getElementById('volumeSlider');
    const volumeMuteX = document.getElementById('volumeMuteX');
    const volumeWave1 = document.getElementById('volumeWave1');
    const volumeWave2 = document.getElementById('volumeWave2');
    const volumeWedge = document.getElementById('volumeWedge');
    let isMuted = true;

    overlay.addEventListener('click', () => {
      overlay.style.display = 'none';
      video.muted = false;
      video.volume = 0.25;
      isMuted = false;
      updateIcon();
    });

    audioToggle.addEventListener('click', () => {
      isMuted = !isMuted;
      video.muted = isMuted;
      if (!isMuted && video.volume === 0) {
        video.volume = 0.25;
        volumeSlider.value = 0.25;
      }
      updateIcon();
    });

    volumeSlider.addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      video.volume = val;
      if (val > 0 && isMuted) {
        isMuted = false;
        video.muted = false;
      } else if (val === 0 && !isMuted) {
        isMuted = true;
        video.muted = true;
      }
      updateIcon();
    });

    function updateIcon() {
      if (isMuted) {
        volumeMuteX.style.display = '';
        volumeWave1.style.display = 'none';
        volumeWave2.style.display = 'none';
      } else {
        volumeMuteX.style.display = 'none';
        volumeWave1.style.display = '';
        volumeWave2.style.display = video.volume > 0.5 ? '' : 'none';
      }
    }
  </script>
